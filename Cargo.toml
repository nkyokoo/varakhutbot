[package]
name = "varakhutbot"
version = "0.1.0"
edition = "2024"
features = ["builtin-queue"]

[dependencies]
serenity = "0.12"
tokio = { version = "1.21.2", features = ["macros", "rt-multi-thread"] }
dotenv = "0.15"
poise = "0.7"
songbird = "0.6.1"
reqwest = "0.12"
symphonia = { version = "0.5", features = ["aac", "mp3", "isomp4", "alac", "flac", "wav", "ogg", "vorbis", "mkv", "pcm"] }


[profile.dev]
opt-level = 0
debug = true
split-debuginfo = '...'  # Platform-specific.
strip = "none"
debug-assertions = true
overflow-checks = true
lto = false
panic = 'unwind'
incremental = true
codegen-units = 256
rpath = false


[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true


[profile.release]
opt-level = 3
debug = false
split-debuginfo = '...'  # Platform-specific.
strip = "none"
debug-assertions = false
overflow-checks = false
lto = false
panic = 'unwind'
incremental = false
codegen-units = 16
rpath = false
